<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniLife — Smart University MVP</title><style>:root{font-family:Inter,system-ui,Arial;background:#f3f6fc;color:#172a4a}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:#102d65;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:850;font-size:25px}.brand span{color:#70d8f5}.pill{background:#284c88;border-radius:30px;padding:7px 13px;font-size:12px}select{padding:10px;border:1px solid #d9e1ef;border-radius:10px;background:white}header select{background:#fff;color:#122b56}main{max-width:1190px;margin:auto;padding:24px 18px}.hero{background:linear-gradient(110deg,#1543a1,#0e8bb1);color:white;border-radius:20px;padding:28px;margin-bottom:22px}.hero h1{margin:4px 0 9px}.hero p{margin:0;opacity:.9}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button{background:white;border:1px solid #dce5f3;padding:11px 14px;border-radius:11px;color:#254069}.nav button.active,.primary{background:#215bd7!important;color:white!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e0e7f1;border-radius:17px;padding:20px;box-shadow:0 3px 14px #12315b09}.stat{font-size:27px;font-weight:800;color:#164dbe}.muted{color:#667894;font-size:13px}.section{margin:18px 0}.section h2{font-size:21px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{background:white;padding:18px;border:1px solid #dfe7f2;border-radius:15px;text-align:left;color:#1b376b;font-weight:650;min-height:84px}.tile:hover{border-color:#1c66d8;background:#f5f9ff}.emoji{font-size:24px;display:block;margin-bottom:8px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{padding:13px;text-align:left;border-bottom:1px solid #edf0f5;font-size:14px}th{background:#eaf1fc;color:#274c8a}.btn{padding:11px 15px;border-radius:10px;background:#e8efff;color:#1c51b4;font-weight:650}.primary{padding:11px 16px;border-radius:10px}.form{display:grid;gap:12px;max-width:650px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #d6e0ee;border-radius:10px}.form textarea{min-height:85px}.notice{padding:13px;border-radius:11px;background:#eaf7ff;color:#15578a;margin:12px 0}.tag{background:#edf4ff;color:#2055a4;padding:5px 9px;border-radius:20px;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.footer{text-align:center;color:#8190a7;padding:28px}.hide{display:none}@media(max-width:750px){.grid,.tiles{grid-template-columns:repeat(2,1fr)}header{padding:15px}.hero{padding:20px}}@media(max-width:450px){.grid,.tiles{grid-template-columns:1fr}.nav button{flex:1 1 40%}main{padding:14px 10px}}</style></head><body><header><div class="brand">◈ Uni<span>Life</span> <small style="font-size:11px;font-weight:400">SMART UNIVERSITY</small></div><div class="row"><span class="pill">● DEMO MVP</span><select id="role" aria-label="Рөл"><option value="student">🎓 Студент</option><option value="teacher">👩‍🏫 Оқытушы</option><option value="admin">🏛️ Әкімшілік</option></select></div></header><main><div class="hero"><div class="muted" style="color:#cdeaff">БІРЫҢҒАЙ ЦИФРЛЫҚ УНИВЕРСИТЕТ</div><h1 id="welcome">Сәлем, студент! 👋</h1><p>Университетің — бір қосымшада! Қызметтерді онлайн пайдалан.</p></div><nav class="nav" id="nav"></nav><div id="content"></div></main><div class="footer">UniLife © 2026 · Стартапты қорғауға арналған демо. Нақты университет деректері қолданылмайды.</div><script>
const $=id=>document.getElementById(id),role=$('role');let page='home';const subjects=['Бағдарламалау','Математика','Деректер қоры','Ағылшын тілі','Экономика'];const schedule=[['Дүйсенбі','09:00','Бағдарламалау','301'],['Дүйсенбі','11:00','Математика','214'],['Сейсенбі','10:00','Деректер қоры','405'],['Сәрсенбі','09:00','Ағылшын тілі','212'],['Бейсенбі','13:00','Экономика','110']];const students=['Айдана Ермек','Әлихан Нұр','Дана Сәрсен','Нұрасыл Қайрат','Мадина Әсет'];const defaults={requests:[{id:1001,type:'Оқу орнынан анықтама',note:'Демонстрациялық өтініш',status:'Дайын'}],grades:{'Айдана Ермек':[90,88,95,91,86]},attendance:{'Айдана Ермек':[true,true,true,false,true]},news:['Студенттерге арналған мансап апталығы басталады','Кітапхана жаңа электрондық ресурстармен толықты']};let db;try{db=JSON.parse(localStorage.getItem('unilife-demo-v1'))||structuredClone(defaults)}catch{db=JSON.parse(JSON.stringify(defaults))}function save(){localStorage.setItem('unilife-demo-v1',JSON.stringify(db))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}const sections={student:[['home','Басты бет'],['profile','Профиль'],['schedule','Сабақ кестесі'],['grades','Бағалар'],['requests','Электрондық деканат'],['services','Барлық қызметтер'],['ai','AI көмекші']],teacher:[['home','Басты бет'],['schedule','Сабақ кестесі'],['journal','Электрондық журнал'],['attendance','Қатысу'],['materials','Оқу материалдары'],['messages','Хабарламалар']],admin:[['home','Басқару панелі'],['requests','Өтініштер'],['people','Студенттер'],['analytics','Аналитика'],['services','Бөлімдер'],['messages','Жаңалықтар']]};function go(p){page=p;render()}function render(){const r=role.value;$('welcome').textContent=r==='student'?'Сәлем, студент! 👋':r==='teacher'?'Оқытушы кабинеті 👩‍🏫':'Әкімшілік басқару панелі 🏛️';$('nav').innerHTML=sections[r].map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');$('content').innerHTML=view(r,page)}role.onchange=()=>{page='home';render()};function home(r){if(r==='student')return `<div class="grid">${card('Орташа GPA','<div class="stat">3.75</div><div class="muted">Демо көрсеткіш</div>')}${card('Сабаққа қатысу','<div class="stat">92%</div><div class="muted">Демо көрсеткіш</div>')}${card('Өтініштер',`<div class="stat">${db.requests.length}</div><div class="muted">Жіберілген өтініш</div>`)}</div><div class="section"><h2>Жылдам қызметтер</h2><div class="tiles">${[['📄','Анықтама алу','requests'],['📅','Сабақ кестесі','schedule'],['📊','Бағалар мен GPA','grades'],['🏠','Жатақхана','services'],['🤖','AI көмекші','ai'],['📚','Цифрлық кітапхана','services']].map(([i,t,p])=>`<button class="tile" onclick="go('${p}')"><span class="emoji">${i}</span>${t}</button>`).join('')}</div></div>${card('Университет жаңалықтары',db.news.map(n=>`<p>📢 ${esc(n)}</p>`).join(''))}`;if(r==='teacher')return `<div class="grid">${card('Топтар','<div class="stat">3</div>')}${card('Студенттер','<div class="stat">75</div>')}${card('Бүгінгі сабақ','<div class="stat">2</div>')}</div><div class="section"><h2>Оқытушы құралдары</h2><div class="tiles"><button class="tile" onclick="go('journal')">📝 Баға қою</button><button class="tile" onclick="go('attendance')">✅ Қатысуды белгілеу</button><button class="tile" onclick="go('materials')">📚 Оқу материалдары</button></div></div>`;return `<div class="grid">${card('Өтініштер',`<div class="stat">${db.requests.length}</div>`)}${card('Студенттер','<div class="stat">1 250</div><div class="muted">Үлгілік сан</div>')}${card('Факультеттер','<div class="stat">6</div><div class="muted">Үлгілік сан</div>')}</div><div class="section"><h2>Жылдам басқару</h2><div class="tiles"><button class="tile" onclick="go('requests')">📄 Өтініштерді қарау</button><button class="tile" onclick="go('people')">👥 Студенттер тізімі</button><button class="tile" onclick="go('analytics')">📈 Мониторинг</button></div></div>`}function requests(r){let rows=db.requests.map(q=>[String(q.id),esc(q.type),esc(q.note),`<span class="tag">${esc(q.status)}</span>`,r==='admin'?`<select onchange="updateRequest(${q.id},this.value)">${['Қаралуда','Қабылданды','Дайын','Қабылданбады'].map(x=>`<option ${q.status===x?'selected':''}>${x}</option>`).join('')}</select>`:'—']);return `<h2>${r==='admin'?'Өтініштерді басқару':'Электрондық деканат'}</h2><div class="card">${table(['№','Қызмет','Түсініктеме','Мәртебе','Әрекет'],rows)}</div>${r==='student'?`<div class="section card"><h3>Жаңа өтініш жіберу</h3><form class="form" onsubmit="submitRequest(event)"><label>Қызмет түрі<select id="reqtype"><option>Оқу орнынан анықтама</option><option>Транскрипт</option><option>Жатақханаға өтініш</option><option>Әлеуметтік көмек</option><option>Академиялық мәселе</option><option>Басқа мәселе</option></select></label><label>Түсініктеме<textarea id="reqnote" required maxlength="500" placeholder="Өтінішіңізді жазыңыз"></textarea></label><button class="primary">Өтініш жіберу</button></form></div>`:''}`}function submitRequest(e){e.preventDefault();db.requests.unshift({id:Date.now(),type:$('reqtype').value,note:$('reqnote').value,status:'Қаралуда'});save();render();alert('Демо өтініш тіркелді! Әкімшілік кабинетінде мәртебесін өзгертуге болады.')}function updateRequest(id,status){let q=db.requests.find(x=>x.id===id);if(q){q.status=status;save();render()}}function journal(){return `<h2>Электрондық журнал · Бағдарламалау</h2><p class="muted">Бағаларды өзгертіңіз — олар студент кабинетінде де көрінеді.</p><div class="card">${table(['Студент',...subjects],students.map(s=>[esc(s),...subjects.map((_,i)=>`<input type="number" min="0" max="100" style="width:75px;padding:7px;border:1px solid #ddd;border-radius:8px" value="${(db.grades[s]||[80,85,90,75,88])[i]}" onchange="setGrade('${s}',${i},this.value)">`)]))}</div>`}function setGrade(s,i,v){if(!db.grades[s])db.grades[s]=[80,85,90,75,88];db.grades[s][i]=Math.max(0,Math.min(100,Number(v)||0));save()}function attendance(){return `<h2>Сабаққа қатысуды белгілеу</h2><div class="card">${table(['Студент','Дүйсенбі','Сейсенбі','Сәрсенбі','Бейсенбі','Жұма'],students.map(s=>[esc(s),...[0,1,2,3,4].map(i=>`<input type="checkbox" ${(db.attendance[s]||[true,true,true,true,true])[i]?'checked':''} onchange="setAttendance('${s}',${i},this.checked)">`)]))}</div>`}function setAttendance(s,i,v){if(!db.attendance[s])db.attendance[s]=[true,true,true,true,true];db.attendance[s][i]=v;save()}function grades(){let vals=db.grades['Айдана Ермек']||[90,88,95,91,86],att=db.attendance['Айдана Ермек']||[true,true,true,false,true];return `<div class="grid">${card('GPA','<div class="stat">3.75</div><p class="muted">Демо академиялық GPA</p>')}${card('Орташа баға',`<div class="stat">${Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)}</div>`)}${card('Қатысу',`<div class="stat">${Math.round(att.filter(Boolean).length/att.length*100)}%</div>`)}</div><div class="section card"><h2>Пәндер бойынша бағалар</h2>${table(['Пән','Баға'],subjects.map((s,i)=>[s,`<strong>${vals[i]}</strong> / 100`]))}</div><div class="notice">Емтихан кестесі: 15–22 желтоқсан (демо). Академиялық қарыздар: жоқ (демо).</div>`}function services(){let items=[['📄','Электрондық деканат'],['🏠','Жатақхана'],['🤝','Әлеуметтік көмек'],['📚','Цифрлық кітапхана'],['💳','Оқу ақысы және төлемдер'],['💼','Жұмыс және мансап'],['🎉','Университет өмірі'],['🗓️','Емтихан кестесі'],['🧑‍🏫','Оқытушылар мен кураторлар'],['📢','Жаңалықтар'],['🧾','Академиялық қарыздар'],['🏢','Факультеттер мен кафедралар']];return `<h2>Университеттің барлық қызметтері</h2><div class="tiles">${items.map(([i,t])=>`<button class="tile" onclick="${t==='Электрондық деканат'||t==='Жатақхана'||t==='Әлеуметтік көмек'?"go('requests')":"alert('Бұл бөлім келесі нұсқада толық іске қосылады. MVP-де бөлімнің орны көрсетілген.')"}"><span class="emoji">${i}</span>${t}</button>`).join('')}</div><div class="notice">MVP-де өтініш беру, журнал, қатысу және басқару жұмыс істейді. Басқа бөлімдер келесі кезеңге жоспарланған.</div>`}function ai(){return `<h2>UniLife AI көмекші · демо</h2><div class="card"><div id="chat" style="min-height:120px;max-height:340px;overflow:auto"><p><b>UniBot:</b> Сәлем! Анықтама, GPA, жатақхана, сабақ кестесі туралы сұраңыз.</p></div><form class="form" onsubmit="ask(event)"><input id="question" required placeholder="Мысалы: анықтаманы қалай аламын?"><button class="primary">Сұрау</button></form><p class="muted">Бұл нақты AI API емес, дайын жауаптары бар демонстрациялық көмекші.</p></div>`}function ask(e){e.preventDefault();let q=$('question').value.trim(),v=q.toLowerCase(),a=v.includes('анықтама')||v.includes('деканат')?'Электрондық деканат бөліміне кіріп, құжат түрін таңдап өтініш жіберіңіз.':v.includes('жатақхана')?'Жатақханаға өтінішті Электрондық деканат бөлімінде жібере аласыз.':v.includes('gpa')||v.includes('баға')?'Бағалар бөлімінде пәндер бойынша ұпайларды және үлгілік GPA көрсеткішін көресіз.':v.includes('кесте')?'Сабақ кестесі бөлімінде күндер, уақыт және аудитория көрсетілген.':'Сұрағыңызды деканатқа өтініш ретінде жіберуге болады. Бұл демо көмекші тек бірнеше тақырыпты түсінеді.';$('chat').innerHTML+=`<p><b>Сіз:</b> ${esc(q)}</p><p><b>UniBot:</b> ${esc(a)}</p>`;$('question').value=''}function view(r,p){if(p==='home')return home(r);if(p==='profile')return card('Студент профилі','<div class="stat">🎓 Айдана Ермек</div><p>Студенттік ID: UL-2026-001</p><p>Факультет: Ақпараттық технологиялар</p><p>Мамандық: Ақпараттық жүйелер · 2-курс · IS-24-1</p><p class="muted">Фото және QR студенттік билет — келесі кезең.</p>');if(p==='schedule')return `<h2>Сабақ кестесі</h2><div class="card">${table(['Күн','Уақыт','Пән','Аудитория'],schedule)}</div>`;if(p==='grades')return grades();if(p==='requests')return requests(r);if(p==='journal')return journal();if(p==='attendance')return attendance();if(p==='services')return services();if(p==='ai')return ai();if(p==='people')return `<h2>Студенттерді басқару</h2><div class="card">${table(['Студент','Топ','Мәртебе'],students.map(s=>[s,'IS-24-1','Белсенді']))}</div>`;if(p==='analytics')return `<h2>Академиялық мониторинг</h2><div class="grid">${card('Орташа қатысу','<div class="stat">91%</div>')}${card('Орташа үлгерім','<div class="stat">84/100</div>')}${card('Өтініштер',`<div class="stat">${db.requests.length}</div>`)}</div><p class="notice">Қатысу және үлгерімнің жалпы сандары — демонстрациялық мәліметтер.</p>`;if(p==='materials')return card('Оқу материалдары','<p>📘 Бағдарламалау негіздері — дәрістер</p><p>📝 Үй тапсырмасы: 3-тапсырма (демо)</p><p class="muted">Файл жүктеу кейінгі нұсқада қосылады.</p>');if(p==='messages')return `<h2>Жаңалықтар және хабарламалар</h2><div class="card">${db.news.map(x=>`<p>📢 ${esc(x)}</p>`).join('')}${r==='admin'?`<form class="form" onsubmit="postNews(event)"><input id="news" required maxlength="180" placeholder="Жаңа хабарлама"><button class="primary">Жариялау</button></form>`:''}</div>`;return home(r)}function postNews(e){e.preventDefault();db.news.unshift($('news').value);save();render()}render();
</script></body></html>
